<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart Is Waiting</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f4ef;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4ef;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#103b2c;padding:20px;text-align:center;">
                <img src="{{brandLogoUrl}}" alt="Da Essence" width="140" style="display:block;margin:0 auto 8px;" />
                <p style="margin:0;color:#d1fae5;font-size:13px;letter-spacing:.2px;">Complete Your Routine</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#0f172a;">Your Cart Is Waiting</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Hi {{customerFirstName}}, you left something in your cart. Your Organic African Soap with Aloe Vera is still available.</p>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:18px;">
                  <tr>
                    <td style="padding:14px 16px;background:#f9fafb;font-size:13px;font-weight:bold;color:#374151;">In Your Cart</td>
                  </tr>
                  <tr>
                    <td style="padding:14px 16px;font-size:14px;line-height:1.7;">
                      {{cartItemsHtml}}
                    </td>
                  </tr>
                </table>

                <a href="{{resumeCheckoutUrl}}" style="display:inline-block;background:#103b2c;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;font-size:14px;">Continue Checkout</a>
                <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#4b5563;">For support, email <a href="mailto:{{supportEmail}}" style="color:#103b2c;">{{supportEmail}}</a>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
