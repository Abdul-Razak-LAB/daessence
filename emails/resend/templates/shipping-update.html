<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Order Is On The Way</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f4ef;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f7f4ef;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#103b2c;padding:20px;text-align:center;">
                <img src="{{brandLogoUrl}}" alt="Da Essence" width="140" style="display:block;margin:0 auto 8px;" />
                <p style="margin:0;color:#d1fae5;font-size:13px;letter-spacing:.2px;">Shipping Update</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#0f172a;">Your Order Is On The Way</h1>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">Hi {{customerFirstName}}, great news. Your order has been shipped.</p>
                <p style="margin:0 0 6px;font-size:14px;"><strong>Order Number:</strong> {{orderNumber}}</p>
                <p style="margin:0 0 6px;font-size:14px;"><strong>Carrier:</strong> {{carrierName}}</p>
                <p style="margin:0 0 18px;font-size:14px;"><strong>Tracking Number:</strong> {{trackingNumber}}</p>

                <a href="{{trackingUrl}}" style="display:inline-block;background:#103b2c;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;font-size:14px;">Track Package</a>

                <p style="margin:18px 0 0;font-size:13px;line-height:1.6;color:#4b5563;">Questions? Contact <a href="mailto:{{supportEmail}}" style="color:#103b2c;">{{supportEmail}}</a>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
